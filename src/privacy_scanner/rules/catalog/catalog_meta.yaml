# Wording shared by every rule.
common_explanations:
  error: >-
    This check could not run: {reason}. No conclusion can be drawn from this scan for it.
  manual: >-
    This point cannot be established by observing the website from outside.
    It is listed so a reviewer can examine it.

disclaimer: >-
  Automated technical observation of one page load from one vantage point.
  It is not a legal assessment and not legal advice. "No issue detected" means
  the scanner did not observe an issue, not that the site meets its legal
  obligations.
