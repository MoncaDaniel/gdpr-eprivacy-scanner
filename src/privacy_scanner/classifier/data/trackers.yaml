  # ----------------------------------------------------------------- functional
  youtube:
    name: YouTube (embedded player)
    category: functional
    hosts: [youtube.com, youtube-nocookie.com]
  vimeo:
    name: Vimeo (embedded player)
    category: functional
    hosts: [player.vimeo.com, vimeo.com]
  google_maps:
    name: Google Maps
    category: functional
    hosts: [maps.googleapis.com]
  recaptcha:
    name: Google reCAPTCHA
    category: functional
    hosts: [google.com, gstatic.com]
    path_prefix: /recaptcha/
  hcaptcha:
    name: hCaptcha
    category: functional
    hosts: [hcaptcha.com]
  intercom:
    name: Intercom (chat)
    category: functional
    hosts: [intercom.io, intercomcdn.com]
  zendesk:
