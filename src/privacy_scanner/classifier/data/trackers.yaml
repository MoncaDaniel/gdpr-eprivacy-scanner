    hosts: [js.stripe.com, m.stripe.network]
  monitoring:
    name: Error / performance monitoring
    category: functional
    exemption_note: >-
      Monitoring tools collect device and usage data; whether this is strictly
      necessary is debated and depends on configuration.
    hosts: [sentry.io, sentry-cdn.com, nr-data.net, newrelic.com, browser-intake-datadoghq.com,
            browser-intake-datadoghq.eu, datadoghq-browser-agent.com]

  # ------------------------------------------------------------- infrastructure
  google_tag_manager:
    name: Google Tag Manager
    category: infrastructure
    exemption_note: >-
      Container loader. The tags it loads are assessed individually; Google
      Analytics (gtag.js) also loads from this host and is caught by its
      collection requests and cookies.
    hosts: [googletagmanager.com]
  google_fonts:
    name: Google Fonts
    category: infrastructure
    exemption_note: >-
      Transmits the visitor's IP address to Google. LG München I
      (3 O 17493/20, 20 Jan 2022) found this unlawful without consent under
      German law; other authorities have not followed uniformly.
    hosts: [fonts.googleapis.com, fonts.gstatic.com]
  google_hosted_libraries:
    name: Google Hosted Libraries / static
    category: infrastructure
    hosts: [ajax.googleapis.com, gstatic.com, ytimg.com]
  adobe_fonts:
    name: Adobe Fonts
    category: infrastructure
    hosts: [use.typekit.net, p.typekit.net]
  public_cdns:
    name: Public CDN
    category: infrastructure
    hosts: [cdnjs.cloudflare.com, cdn.jsdelivr.net, unpkg.com, code.jquery.com,
            bootstrapcdn.com, cloudfront.net, akamaihd.net, akamaized.net, fastly.net,
            azureedge.net, b-cdn.net, cloudinary.com, imgix.net, shopifycdn.com,
            cdn.shopify.com, wp.com, squarespace-cdn.com, wixstatic.com, polyfill-fastly.io]
