# Curated third-party host knowledge base (ADR-0013).
#
# Self-authored on purpose: the best-known tracker lists (Disconnect, DuckDuckGo
# Tracker Radar) are CC BY-NC-SA, which would bar any commercial use of this
# project. Entries match a request host by suffix ("doubleclick.net" matches
# "stats.g.doubleclick.net"), optionally narrowed by a path prefix. The most
# specific (longest) matching suffix wins.
#
# Categories for hosts: analytics | marketing | functional | infrastructure |
# consent_management (CMP hosts are merged in from cmp.yaml).
# `exemption` overrides the category default where the vendor's own design
# makes the consent question configuration-dependent.

vendors:
  # ------------------------------------------------------------------ analytics
  google_analytics:
    name: Google Analytics
    category: analytics
    hosts: [google-analytics.com, analytics.google.com]
  microsoft_clarity:
    name: Microsoft Clarity
    category: analytics
    hosts: [clarity.ms]
  hotjar:
    name: Hotjar
    category: analytics
    hosts: [hotjar.com, hotjar.io]
  matomo_cloud:
    name: Matomo Cloud
    category: analytics
    exemption: conditional
    exemption_note: >-
      Matomo can be configured for the CNIL audience-measurement exemption;
      the configuration is not observable from outside.
    hosts: [matomo.cloud]
  piano_analytics:
    name: Piano Analytics (AT Internet)
    category: analytics
    exemption: conditional
    exemption_note: >-
      Piano Analytics offers a configuration intended for the CNIL
      audience-measurement exemption; the configuration is not observable.
    hosts: [xiti.com, pa-cd.com]
  cloudflare_web_analytics:
    name: Cloudflare Web Analytics
    category: analytics
    exemption: conditional
    exemption_note: >-
      Cookieless page-view beacon. Art. 5(3) still covers sending information
      from the device (EDPB Guidelines 2/2023); whether an exemption applies
      depends on what is collected and for whom.
    hosts: [cloudflareinsights.com]
  adobe_analytics:
    name: Adobe Analytics
    category: analytics
    hosts: [omtrdc.net, 2o7.net, demdex.net]
  segment:
    name: Segment
    category: analytics
    hosts: [segment.io, segment.com, segmentapis.com]
  amplitude:
    name: Amplitude
    category: analytics
    hosts: [amplitude.com]
  mixpanel:
    name: Mixpanel
    category: analytics
    hosts: [mixpanel.com, mxpnl.com]
  heap:
    name: Heap
    category: analytics
    hosts: [heapanalytics.com, heap-api.com]
  fullstory:
    name: FullStory
    category: analytics
    hosts: [fullstory.com]
  mouseflow:
    name: Mouseflow
    category: analytics
    hosts: [mouseflow.com]
  contentsquare:
    name: Contentsquare
    category: analytics
    hosts: [contentsquare.net, contentsquare.com]
  yandex_metrica:
    name: Yandex Metrica
    category: analytics
    hosts: [mc.yandex.ru, mc.yandex.com, mc.webvisor.org]

