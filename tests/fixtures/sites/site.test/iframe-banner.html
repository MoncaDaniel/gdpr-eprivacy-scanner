<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Banner in a cross-origin iframe fixture</title></head>
<body>
  <h1>Iframe CMP</h1>
  <!-- Some CMPs (e.g. Sourcepoint) render the banner in a cross-origin iframe. -->
  <iframe src="http://cmp.test:{{PORT}}/banner.html" title="Consent"
          style="position:fixed;bottom:0;left:0;width:100%;height:160px;border:0"></iframe>
</body>
</html>
