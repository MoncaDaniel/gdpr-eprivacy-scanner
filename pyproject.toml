[project]
name = "privacy-scanner"
version = "0.1.0"
description = "Evidence-based GDPR + ePrivacy website scanner: observes what a site stores and contacts before consent, and ties every finding to the law."
readme = "README.md"
license = "MIT"
authors = [{ name = "Daniel Moncada León", email = "danielmoncada10@gmail.com" }]
requires-python = ">=3.12,<3.13"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "playwright>=1.49,<2",
  "tldextract>=5.1,<6",
  "typer>=0.15,<1",
  "rich>=13.9",
]

[project.scripts]
privacy-scanner = "privacy_scanner.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privacy_scanner"]

# --------------------------------------------------------------------------- #
# Quality gates
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "C4", "PTH", "RUF", "S", "ASYNC", "PL", "TRY", "N",
]
ignore = [
  "PLR0913",  # domain constructors legitimately take many keyword args
  "TRY003",   # explicit messages on domain exceptions are wanted
  "PLR2004",  # magic numbers are fine in limits/config defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "PLR2004", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["privacy_scanner"]

[[tool.mypy.overrides]]
module = ["tldextract.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
  "integration: drives a real Chromium against hermetic local fixture sites",
]

[tool.coverage.run]
source = ["privacy_scanner"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
